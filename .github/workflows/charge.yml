name: charge due subscriptions

# Calls the deployment's charge endpoint; all keys stay on Vercel. The collector also runs
# whenever someone has the app open, so this only covers the time nobody is watching.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  charge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect due payments and sync community access
        run: |
          curl -fsS -X POST https://monthly-sol.vercel.app/api/cron/charge \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}"
